<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

            <!-- 移动端菜单按钮 -->

                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>

            <!-- 桌面端菜单链接 -->
            <div class="hidden w-full md:block md:w-auto" id="navbar-dropdown">
                <ul class="flex flex-col font-medium p-4 md:p-0 mt-4 border border-gray-100 rounded-lg md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 items-center">
                    
                    <!-- 首页 -->
                    <li><a href="index.html" class="block py-2 px-3 text-gray-900 rounded md:bg-transparent md:p-0" aria-current="page">首页</a></li>
                    
                    <!-- 产品（下拉菜单） -->
                    <li class="relative group">
                        <button class="flex items-center justify-between w-full py-2 px-3 text-gray-900 rounded hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-600 md:p-0 cursor-pointer">
                            产品
                            <svg class="w-2.5 h-2.5 ms-2.5" fill="none" stroke="currentColor" viewBox="0 0 10 6"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4"/></svg>
                        </button>
                        
                        <div class="dropdown-menu absolute left-1/2 top-full w-64 pt-4 z-50"> 
                            <div class="bg-white divide-y divide-gray-100 rounded-xl shadow-xl border border-gray-100 overflow-hidden">
                                <ul class="text-sm text-gray-700">
                                    <li>
                                        <a href="apppad.html" class="flex items-center px-4 py-3 hover:bg-gray-50 transition-colors">

                                            <div>
                                                <div class="font-semibold text-gray-900">AppPad</div>
                                                <div class="text-xs text-gray-500">macOS 26启动台替代品</div>
                                            </div>
                                        </a>
                                    </li>
                                    <li>
                                        <a href="devicemirror.html" class="flex items-center px-4 py-3 hover:bg-gray-50 transition-colors">
                                            <img src="../img/devicemirror-logo.png" class="w-10 h-10 mr-3">
                                            <div>

                        </div>
                    </li>

                    <!-- 联系我们 & 隐私政策 -->
                    <li><a href="contact.html" class="block py-2 px-3 text-blue-600 rounded hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-600 md:p-0">联系我们</a></li>
                    <li><a href="privacy.html" class="block py-2 px-3 text-gray-900 rounded hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-600 md:p-0">隐私政策</a></li>

                    <!-- 语言切换按钮 -->
                    <li class="flex items-center ml-2 border-l border-gray-200 pl-4 h-6">
                        <a href="../contact.html" id="lang-toggle" class="flex items-center text-sm font-medium text-slate-500 hover:text-slate-900 transition-colors group/lang cursor-pointer">
        <svg class="w-4 h-4 mr-1 text-slate-400 group-hover/lang:text-slate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>
        EN

                </ul>
            </div>
        </div>

    <!-- 联系内容区 -->
    <main class="flex-grow flex items-center justify-center pt-32 pb-20 px-4">
        <div class="w-full max-w-lg bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
            <h1 class="text-3xl font-bold text-slate-900 mb-2">联系我们</h1>
            <p class="text-slate-500 mb-8">有任何问题或建议？请告诉我们。</p>

            <!-- 错误提示信息（默认隐藏） -->
            <div id="error-msg" class="hidden mb-4 p-3 rounded-lg bg-red-50 text-red-600 text-sm font-medium flex items-center">
                <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                内容不能为空。
            </div>

            <div class="space-y-4">
                <div>
                    <label for="message" class="block mb-2 text-sm font-medium text-slate-700">您的留言</label>
                    <textarea id="message" rows="6" class="block p-3 w-full text-sm text-slate-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors" placeholder="请在此输入您的反馈..."></textarea>
                </div>
                
                <button onclick="sendEmail()" class="w-full text-white bg-slate-900 hover:bg-slate-800 focus:ring-4 focus:ring-slate-300 font-medium rounded-lg text-sm px-5 py-3 text-center transition-all">
                    发送邮件
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-white py-12">
        <div class="max-w-screen-xl mx-auto px-4 border-t border-gray-100 pt-8 flex flex-col md:flex-row justify-between items-center">
            <div class="mb-4 md:mb-0 text-center md:text-left">
                <span class="text-xl font-bold text-slate-800">Fineusing</span>
                <p class="text-sm text-slate-500 mt-1">为macOS精心设计</p>
            </div>
            <div class="flex space-x-6 text-slate-500 text-sm">
                <a href="contact.html" class="hover:text-blue-600 transition-colors">联系我们</a>
                <a href="privacy.html" class="hover:text-blue-600 transition-colors">隐私政策</a>
            </div>
        </div>
        <div class="text-center text-slate-400 text-xs mt-8">
            &copy; 2025 Fineusing. 保留所有权利。
        </div>
    </footer>

    <!-- 逻辑脚本 -->
    <script>
        // 移动端菜单
        document.getElementById('menu-toggle').addEventListener('click', () => {
            document.getElementById('navbar-dropdown').classList.toggle('hidden');
        });

        // 发送邮件逻辑
        function sendEmail() {
            const textarea = document.getElementById('message');
            const errorDiv = document.getElementById('error-msg');
            const content = textarea.value.trim();

            if (content === "") {
                // 内容为空，显示错误
                errorDiv.classList.remove('hidden');
                textarea.classList.add('border-red-500', 'bg-red-50');
                textarea.focus();
            } else {
                // 内容不为空，隐藏错误，调用系统邮件
                errorDiv.classList.add('hidden');
                textarea.classList.remove('border-red-500', 'bg-red-50');
                
                // 构建 mailto 链接
                const subject = encodeURIComponent("Fineusing 反馈");
                const body = encodeURIComponent(content);
                window.location.href = `mailto:ttianyaa@icloud.com?subject=${subject}&body=${body}`;
            }
        }

        // 语言切换逻辑（切换到英文）
        document.getElementById('lang-toggle').addEventListener('click', function() {
            localStorage.setItem('site_lang', 'en');
            // window.location.href = '../contact.html';
        });
    </script>
</body>
